name: "Upload release files"
description: "配布ファイルを1つずつzipにせず、preview-pages用のArtifactとしてアップロードする。"
inputs:
  path:
    description: "アップロードするファイルのパスかglob。複数行で複数指定できる。"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Upload release files
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        UPLOAD_PATH: ${{ inputs.path }}
      with:
        script: |
          const path = require("path");
          const { pathToFileURL } = require("url");

          const { default: uploadReleaseFiles } = await import(
            pathToFileURL(path.join(process.env.ACTION_PATH, "upload.js")).href
          );
          await uploadReleaseFiles({ core, glob, uploadPath: process.env.UPLOAD_PATH });
